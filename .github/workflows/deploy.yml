name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '21.7.3'
          cache: 'npm'

      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: install hexo + plugins
        run: |
          if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then
            npm install --registry=https://registry.npmmirror.com
          else
            echo "node_modules already cached, skipping npm install"
          fi

      - name: generate public
        run: ./node_modules/hexo/bin/hexo g

      - name: prepare server staging dir
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            rm -rf /tmp/blog-staging
            mkdir -p /tmp/blog-staging

      - name: copy public to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "public"
          target: "/tmp/blog-staging"

      - name: build & restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /tmp/blog-staging
            cp /data/docker-compose/blog/Dockerfile.final .
            cp /data/docker-compose/blog/ads.txt .
            cp /data/docker-compose/blog/docker-compose.yaml .
            TAG="v$(date +%s)"
            sed -i "s|image: blog:.*|image: blog:${TAG}|g" docker-compose.yaml
            docker build -t "blog:${TAG}" -f Dockerfile.final .
            docker-compose down
            docker-compose up -d
            OLD=$(docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | grep '^blog:' | grep -v "^blog:${TAG} " | awk '{print $2}')
            if [ -n "$OLD" ]; then
              echo "$OLD" | xargs -r docker rmi 2>/dev/null || true
            fi
            cd /
            rm -rf /tmp/blog-staging
